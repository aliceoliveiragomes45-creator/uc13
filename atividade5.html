<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: rgb(236, 171, 110);
        }
        form{
            background-color: aliceblue;
            padding: 20px;
            border-radius: 1%;
            box-shadow: 0 5px 15px rgba(0,0,0.1);
        }
        div{
            margin-bottom: 10px;
        }
        label{
            display: block;
            margin-bottom: 10px;
        }
        input{
            width: 100%;
            padding: 10px;
            box-sizing:border-box;
        }
        button{
            width: 100%;
            padding: 10px;
            background-color: rgb(201, 94, 6);
            color: rgb(241, 241, 241);
            border: none;
            border-radius: 2%;
            cursor: pointer;
        }
        button:houver{
            background-color: rgb(190, 49, 49);
            transform: scale(1,1);
        }

    </style>
</head>
<body>
    <form action="">
        <h2>Create Account</h2>
        <div>
            <label for="usuario">UserName</label>
        <input type="text" name="usuario" id="usuario"placeholder="Insert your user name..." required>
        </div>
        <div>
            <label for="email">E-mail</label>
            <input type="text" name="email" id="email" placeholder="hello@exemple.com" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input type="text" name="password" id="password" placeholder="password..." required>
        </div>
        <div>
            <label for="confirm password">Confirm Password</label>
            <input type="text" name="password" id="password" placeholder="confirm password..." required>
        </div>
        <button type="submit">Submit</button>
        
    </form>
    
</body>
</html>
